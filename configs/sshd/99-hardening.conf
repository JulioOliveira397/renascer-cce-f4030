# /etc/ssh/sshd_config.d/99-hardening.conf
# Projeto Renascer CCE F4030 - exemplo sanitizado
# Depois de editar: sudo sshd -t && sudo systemctl reload ssh

# Só chave pública (ED25519)
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no

# Nada de root remoto; só a conta de suporte
PermitRootLogin no
AllowUsers suporte

# Reduz janelas para força bruta
MaxAuthTries 3
LoginGraceTime 30
